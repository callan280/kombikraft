name: Offline checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install .
      - run: python -m unittest discover -s tests
      - run: python -m unittest discover -s native/tests -p 'test_*.py'
      - run: python -m unittest discover -s mgu/tests -p 'test_*.py'
      - run: node mgu/tests/preferences.test.js
      - run: node mgu/experiments/vehicle-enhancements/tests/features.test.js
      - run: python tools/audit_publication.py
      - run: python -m kombikraft doctor
