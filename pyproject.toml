[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kombikraft"
version = "0.1.0a2"
description = "Offline BMW cluster research, source-graphics previews and original-controller fixtures"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "KombiKraft contributors"}]
classifiers = ["Development Status :: 2 - Pre-Alpha", "Programming Language :: Python :: 3", "Operating System :: OS Independent"]
dependencies = []

[project.optional-dependencies]
factory = ["unicorn==2.1.4"]
native = ["Pillow==13.0.0"]

[project.scripts]
kombikraft = "kombikraft.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kombikraft = ["layout_routes.json", "web/**/*.html", "web/**/*.js", "web/**/*.css", "web/*.html", "web/*.js", "web/*.css", "factory/README.md"]
